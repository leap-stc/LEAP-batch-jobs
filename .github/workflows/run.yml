name: Run Batch Job

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Path to the job folder (e.g. examples/small_job)'
        required: true
        type: string

      instance_type:
        description: 'GCP instance type (overrides config.yml)'
        required: true
        default: 'from config'
        type: choice
        options:
          - 'from config'
          - n4-standard-4
          - n4-standard-8
          - n4-standard-16
          - n4-highmem-16
          - n4-highmem-32

      disk_size_gb:
        description: 'Attached disk size in GB (none = no extra disk). Only if you need to cache data locally before writing to GCP.'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - '50'
          - '100'
          - '200'
          - '500'

      timeout_hours:
        description: 'Max job runtime in hours. GPU jobs default 8h, CPU 24h. Injected as max_duration into config.'
        required: true
        default: '8'
        type: choice
        options:
          - '4'
          - '8'
          - '24'
          - '48'

      job_env:
        description: 'Extra env vars to pass to the job (e.g. YEAR=2010 OUTPUT_PATH=gs://...). Overrides defaults in config.yml envs.'
        required: false
        default: ''
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dispatch

      - name: Validate config
        env:
          INPUT_JOB: ${{ inputs.job }}
        run: |
          cd "$INPUT_JOB"
          ACCELERATORS=$(yq '.resources.accelerators // "none"' config.yml)
          ALLOWED=("T4:1" "A100:1" "none")
          if [[ ! " ${ALLOWED[*]} " =~ " ${ACCELERATORS} " ]]; then
            echo "ERROR: accelerators '${ACCELERATORS}' not in allowlist (T4:1, A100:1)"
            exit 1
          fi
          echo "Accelerators: ${ACCELERATORS} — OK"

      - name: Submit job
        id: submit
        env:
          SKYPILOT_API_URL: ${{ vars.SKYPILOT_API_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OSN_ACCESS_KEY_INBOX: ${{ secrets.OSN_ACCESS_KEY_INBOX }}
          OSN_SECRET_KEY_INBOX: ${{ secrets.OSN_SECRET_KEY_INBOX }}
          OSN_ENDPOINT: ${{ secrets.OSN_ENDPOINT }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_INSTANCE_TYPE: ${{ inputs.instance_type }}
          INPUT_DISK_SIZE_GB: ${{ inputs.disk_size_gb }}
          INPUT_TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          INPUT_JOB_ENV: ${{ inputs.job_env }}
        run: |
          uv run sky api login -e "$SKYPILOT_API_URL"

          JOB_NAME="$(basename "$(dirname "$INPUT_JOB")")-$(basename "$INPUT_JOB")-$GITHUB_ACTOR-$GITHUB_RUN_ID"
          LAUNCH_ARGS=(-y -n "$JOB_NAME" --async)
          [[ "$INPUT_DISK_SIZE_GB" =~ ^[0-9]+$ ]] && LAUNCH_ARGS+=(--disk-size "$INPUT_DISK_SIZE_GB")
          [[ "$INPUT_INSTANCE_TYPE" != "from config" ]] && LAUNCH_ARGS+=(--instance-type "$INPUT_INSTANCE_TYPE")
          for pair in $INPUT_JOB_ENV; do
            LAUNCH_ARGS+=(--env "$pair")
          done
          [[ -n "$SLACK_WEBHOOK_URL" ]] && LAUNCH_ARGS+=(--env "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL")
          [[ -n "$OSN_ACCESS_KEY_INBOX" ]] && LAUNCH_ARGS+=(--env "OSN_ACCESS_KEY_INBOX=$OSN_ACCESS_KEY_INBOX")
          [[ -n "$OSN_SECRET_KEY_INBOX" ]] && LAUNCH_ARGS+=(--env "OSN_SECRET_KEY_INBOX=$OSN_SECRET_KEY_INBOX")
          [[ -n "$OSN_ENDPOINT" ]] && LAUNCH_ARGS+=(--env "OSN_ENDPOINT=$OSN_ENDPOINT")

          cd "$INPUT_JOB"
          yq -i ".max_duration = \"${INPUT_TIMEOUT_HOURS}h\"" config.yml
          LAUNCH_OUTPUT=$(uv run sky jobs launch "${LAUNCH_ARGS[@]}" config.yml 2>&1)
          echo "$LAUNCH_OUTPUT"

          JOB_ID=$(echo "$LAUNCH_OUTPUT" | grep -oP 'Job submitted, ID: \K\d+' || true)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          SKYPILOT_API_URL: ${{ vars.SKYPILOT_API_URL }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_INSTANCE_TYPE: ${{ inputs.instance_type }}
          INPUT_DISK_SIZE_GB: ${{ inputs.disk_size_gb }}
          INPUT_TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          JOB_ID: ${{ steps.submit.outputs.job_id }}
          STEP_OUTCOME: ${{ steps.submit.outcome }}
        run: |
          DASHBOARD="${SKYPILOT_API_URL}/dashboard"
          if [ "$STEP_OUTCOME" = "success" ]; then
            echo "### Job submitted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Job submission failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Job | \`${INPUT_JOB}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Instance | \`${INPUT_INSTANCE_TYPE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Disk | \`${INPUT_DISK_SIZE_GB}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timeout | \`${INPUT_TIMEOUT_HOURS}h\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job ID | \`${JOB_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard | ${DASHBOARD} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Stream logs:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sky api login -e ${SKYPILOT_API_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "sky jobs logs --name $(basename "$(dirname "$INPUT_JOB")")-$(basename "$INPUT_JOB")-$GITHUB_ACTOR-$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
