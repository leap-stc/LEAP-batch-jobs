name: project_name_gpu

resources:
  cloud: gcp
  region: us-central1
  
  # GPU options (uncomment one):
  # accelerators: T4:1           # 16GB VRAM, ~$0.26/hr spot
  # accelerators: A100:1       # 40GB VRAM, ~$0.33/hr spot 

  # Spot VMs save ~60-70% but can be interrupted mid-job.
  # Set to true only if your script can resume (e.g. checkpointing / skip_existing).
  use_spot: false 

workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh

run: |
  set -e
  source $HOME/.local/bin/env
  echo "Checking GPU..."
  nvidia-smi || echo "nvidia-smi not found — no GPU driver installed"
  echo "Starting batch job"
  PYTHONUNBUFFERED=1 uv run batch.py
